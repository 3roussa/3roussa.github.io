<style>
/* Layout : une fenêtre d'application au centre, barre de navigation des pages dessous */
:root{
  --bg:#eef1f5; --fg:#16202c; --muted:#5d6b7a; --frame:#1b2430; --frame-line:#2c3846; --accent:#2f7de1; --hot:rgba(47,125,225,.18); --hot-line:#5aa2ff; --chip:#ffffff; --chip-line:#d5dce5;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e131a;--fg:#e3e9f0;--muted:#8d9aaa;--frame:#1b2430;--frame-line:#33414f;--chip:#17202a;--chip-line:#2b3744;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e131a;--fg:#e3e9f0;--muted:#8d9aaa;--frame:#1b2430;--frame-line:#33414f;--chip:#17202a;--chip-line:#2b3744;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.win{background:var(--frame);border:1px solid var(--frame-line);border-radius:10px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(0,0,0,.45)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--frame-line);color:#c9d3de;font:500 12px var(--mono)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#3a4756;display:block}
.bar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .p{color:#8fb8ff}
.screen{position:relative;background:#0f0f0f}
.screen img{display:block;width:100%;height:auto;max-width:100%}
.hs{position:absolute;border:1.5px solid transparent;border-radius:6px;background:transparent;cursor:pointer;padding:0;transition:background .15s,border-color .15s}
.hs:hover,.hs:focus-visible{background:var(--hot);border-color:var(--hot-line);outline:none}
.hs.pulse{animation:pulse 2.2s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(90,162,255,.55)}100%{box-shadow:0 0 0 12px rgba(90,162,255,0)}}
.hs.back{border:2.5px solid #ffcc33;background:rgba(255,204,51,.22);box-shadow:0 0 0 3px rgba(255,204,51,.35);animation:glow 1.6s ease-in-out infinite}
.hs.back:hover,.hs.back:focus-visible{background:rgba(255,204,51,.45);border-color:#ffe08a}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px rgba(255,204,51,.45)}50%{box-shadow:0 0 0 7px rgba(255,204,51,.12)}}
.backtag{position:absolute;transform:translateY(-15%);display:flex;align-items:center;gap:6px;background:#ffcc33;color:#1b1b1b;font:600 12px var(--sans);padding:4px 10px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.35);cursor:pointer;border:0;white-space:nowrap}
.backtag::before{content:"";width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:8px solid #ffcc33;position:absolute;left:-7px;top:50%;transform:translateY(-50%)}
.homebtn{font:600 12px var(--sans);background:#ffcc33;color:#1b1b1b;border:0;border-radius:6px;padding:4px 10px;cursor:pointer}
.homebtn:focus-visible,.backtag:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.hs.pulse,.hs.back{animation:none}}
.hint{font-size:13px;color:var(--muted)}
.hint b{color:var(--fg);font-weight:500}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{font:500 12.5px var(--sans);background:var(--chip);color:var(--fg);border:1px solid var(--chip-line);border-radius:999px;padding:6px 12px;cursor:pointer}
nav button[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:#fff}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cap{font-size:13.5px;line-height:1.5;max-width:75ch}
.cap .k{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px}
</style>
